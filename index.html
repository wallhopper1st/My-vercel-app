<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MiniCord Ultimate</title>
  <style>
    :root {
      --bg-servers: #1e1f22;
      --bg-channels: #2b2d31;
      --bg-chat: #313338;
      --bg-chat-input: #383a40;
      --bg-hover: #35373c;
      --bg-active: #404249;
      --bg-user: #232428;
      --text-main: #dbdee1;
      --text-muted: #949ba4;
      --accent: #5865f2;
      --chat-font-size: 15px;
      --sidebar-width: 240px;
    }

    body.theme-light {
      --bg-servers: #e3e5e8; --bg-channels: #f2f3f5; --bg-chat: #ffffff;
      --bg-chat-input: #ebedef; --bg-hover: #e0e1e5; --bg-active: #d8dadf;
      --bg-user: #ebedef; --text-main: #2e3338; --text-muted: #5c6067;
    }
    body.theme-amoled {
      --bg-servers: #000000; --bg-channels: #0a0a0a; --bg-chat: #121212;
      --bg-chat-input: #1e1e1e; --bg-hover: #222222; --bg-active: #2a2a2a;
      --bg-user: #050505; --text-main: #ffffff; --text-muted: #aaaaaa;
    }
    body.theme-cyberpunk {
      --bg-servers: #0b091a; --bg-channels: #130f26; --bg-chat: #1b1338;
      --bg-chat-input: #261b4f; --bg-hover: #35256e; --bg-active: #4a3399;
      --bg-user: #0f0b21; --text-main: #00ffcc; --text-muted: #ff77b7; --accent: #ff007f;
    }
    body.theme-nord {
      --bg-servers: #2e3440; --bg-channels: #3b4252; --bg-chat: #434c5e;
      --bg-chat-input: #4c566a; --bg-hover: #5e81ac; --bg-active: #81a1c1;
      --bg-user: #2e3440; --text-main: #eceff4; --text-muted: #d8dee9; --accent: #88c0d0;
    }
    body.theme-retro {
      --bg-servers: #181818; --bg-channels: #222222; --bg-chat: #2b2b2b;
      --bg-chat-input: #383838; --bg-hover: #444444; --bg-active: #555555;
      --bg-user: #111111; --text-main: #33ff33; --text-muted: #00aa00; --accent: #00ff00;
    }
    body.theme-sunset {
      --bg-servers: #221224; --bg-channels: #311a36; --bg-chat: #42244a;
      --bg-chat-input: #573061; --bg-hover: #6d3d7a; --bg-active: #844c94;
      --bg-user: #1b0e1e; --text-main: #ffd166; --text-muted: #ff9f1c; --accent: #ef476f;
    }
    body.theme-emerald {
      --bg-servers: #0d1f17; --bg-channels: #132e22; --bg-chat: #1b3d2e;
      --bg-chat-input: #244f3b; --bg-hover: #2f664e; --bg-active: #3b7d61;
      --bg-user: #091711; --text-main: #e2f0d9; --text-muted: #a9d18e; --accent: #375623;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; font-size: var(--chat-font-size); }
    body { display: flex; height: 100vh; width: 100vw; background-color: var(--bg-chat); color: var(--text-main); overflow: hidden; }

    .svg-icon { width: 20px; height: 20px; fill: currentColor; display: inline-block; vertical-align: middle; }

    /* Auth Screen */
    #auth-screen { position: fixed; inset: 0; background: #1e1f22; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .auth-card { background: #313338; width: 100%; max-width: 400px; padding: 32px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .auth-title { font-size: 24px; font-weight: bold; color: white; margin-bottom: 8px; text-align: center; }
    .auth-subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

    /* App Layout */
    #app-container { display: none; width: 100vw; height: 100vh; position: relative; }
    .servers { width: 72px; background: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 10px; flex-shrink: 0; overflow-y: auto; z-index: 20; }
    .server-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-chat); display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; color: var(--text-main); flex-shrink: 0; position: relative; }
    .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--accent); color: white; }
    .server-badge { position: absolute; top: 0; right: 0; background: #da373c; color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 2px solid var(--bg-servers); display: none; }
    .divider { width: 32px; height: 2px; background: var(--bg-hover); border-radius: 1px; flex-shrink: 0; }

    .channels { width: var(--sidebar-width); background: var(--bg-channels); display: flex; flex-direction: column; flex-shrink: 0; position: relative; min-width: 160px; max-width: 400px; z-index: 15; }
    .sidebar-resizer { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: ew-resize; z-index: 10; background: transparent; }
    .sidebar-resizer:hover { background: var(--accent); }

    .server-header { height: 48px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; border-bottom: 1px solid var(--bg-servers); color: var(--text-main); }
    .section-label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; padding: 16px 12px 4px 12px; letter-spacing: 0.5px; }
    .channel-list { padding: 4px 8px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .channel-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; position: relative; }
    .channel-item:hover { background: var(--bg-hover); color: var(--text-main); }
    .channel-item.active { background: var(--bg-active); color: var(--text-main); font-weight: 500; }

    .user-panel { height: 54px; background: var(--bg-user); padding: 0 8px; display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 6px; overflow: hidden; cursor: pointer; padding: 4px; border-radius: 4px; flex: 1; }
    .user-info:hover { background: var(--bg-hover); }
    .avatar-container { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; background-size: cover; background-position: center; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-user); position: absolute; bottom: -1px; right: -1px; }
    .status-online { background: #23a55a; }
    .status-idle { background: #f0b232; }
    .status-dnd { background: #f23f43; }
    .status-offline { background: #80848e; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); min-width: 0; position: relative; }
    .chat-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bg-servers); font-weight: bold; color: var(--text-main); }

    .workspace-main { flex: 1; display: flex; position: relative; overflow: hidden; min-height: 0; }
    .messages-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
    
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; gap: 14px; position: relative; padding: 6px 8px; border-radius: 4px; }
    .message:hover { background: var(--bg-hover); }
    .msg-author { font-weight: bold; color: var(--text-main); margin-right: 8px; }
    .msg-time { font-size: 11px; color: var(--text-muted); }

    .typing-bar { height: 22px; padding: 0 18px; font-size: 11px; color: var(--text-muted); font-style: italic; }
    .input-wrapper { padding: 0 16px 20px 16px; display: flex; gap: 8px; align-items: center; }
    .chat-input { flex: 1; padding: 12px 16px; border-radius: 8px; border: none; background: var(--bg-chat-input); color: var(--text-main); outline: none; }
    .input-btn-group { display: flex; gap: 6px; }
    .emoji-btn { background: var(--bg-chat-input); border: none; border-radius: 8px; width: 42px; cursor: pointer; font-size: 16px; color: var(--text-main); font-weight: bold; }
    .emoji-btn:hover { background: var(--bg-hover); }

    .members { width: 220px; background: var(--bg-channels); padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--bg-servers); flex-shrink: 0; overflow-y: auto; }
    .member-item { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
    .member-item:hover { background: var(--bg-hover); }
    .member-name { font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg-chat); width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 8px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid var(--bg-servers); color: var(--text-main); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: bold; }
    .modal-input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--bg-servers); background: var(--bg-chat-input); color: var(--text-main); margin-bottom: 14px; outline: none; }
    .btn { padding: 9px 16px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; transition: 0.15s; }
    .btn-primary { background: var(--accent); }
    .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { color: var(--text-main); background: var(--bg-hover); }

    @media (max-width: 768px) {
      .channels { position: absolute; left: 72px; top: 0; bottom: 0; z-index: 40; box-shadow: 5px 0 15px rgba(0,0,0,0.5); transform: translateX(-120%); transition: transform 0.3s ease; }
      .channels.mobile-open { transform: translateX(0); }
      .members { display: none; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body class="theme-dark">

  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-title" id="auth-title">Welcome to MiniCord</div>
      <div class="auth-subtitle" id="auth-subtitle">Log in with your username & password</div>
      
      <div id="auth-error" style="color:#da373c; font-size:13px; margin-bottom:12px; display:none; text-align:center;"></div>

      <input type="text" class="modal-input" id="auth-username" placeholder="Username" />
      <input type="password" class="modal-input" id="auth-password" placeholder="Password" />

      <button class="btn btn-primary" id="auth-submit-btn" style="width:100%; margin-bottom:12px;">Log In</button>
      <div style="text-align:center; font-size:13px; color:var(--text-muted); cursor:pointer;" id="auth-switch-mode">
        Need an account? <span style="color:var(--accent); font-weight:bold;">Sign Up</span>
      </div>
    </div>
  </div>

  <!-- App Container -->
  <div id="app-container">
    <div class="servers" id="server-list-container"></div>

    <div class="channels" id="channels-sidebar">
      <div class="sidebar-resizer" id="sidebar-resizer"></div>
      <div class="server-header">
        <span id="server-name">Gaming Hub</span>
      </div>

      <div class="section-label" id="sidebar-label">Text Channels</div>
      <div class="channel-list" id="channel-list"></div>

      <div class="user-panel">
        <div class="user-info" id="open-my-profile-btn" title="My Profile & Status">
          <div class="avatar-container">
            <div class="avatar" id="my-avatar">U</div>
            <div class="status-dot status-online" id="my-status-dot"></div>
          </div>
          <div style="overflow:hidden;">
            <div style="font-weight: bold; color: var(--text-main); font-size:13px; white-space:nowrap;" id="my-name">You</div>
            <div style="font-size: 11px; color: var(--text-muted);" id="role-label">Online</div>
          </div>
        </div>
        <div style="display:flex; gap:2px;">
          <button class="icon-btn" id="open-settings-btn" title="Settings">⚙️</button>
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div>
          <span style="color: var(--text-muted); font-size: 20px;" id="header-symbol">#</span>
          <span id="channel-name">general</span>
        </div>
      </div>

      <div class="workspace-main">
        <div class="messages-wrapper" id="messages-wrapper">
          <div class="messages" id="messages"></div>
        </div>
      </div>

      <div class="typing-bar" id="typing-bar"></div>
      <div class="input-wrapper" id="chat-input-wrapper">
        <input type="text" class="chat-input" id="chat-input" placeholder="Message #general" autocomplete="off" />
        <div class="input-btn-group">
          <button class="emoji-btn" id="emoji-btn" title="Quick Emoji">🔥</button>
        </div>
      </div>
    </div>

    <div class="members">
      <div class="section-label" style="padding:0;" id="online-count">ONLINE — 0</div>
      <div id="member-list" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal" style="width: 400px;">
      <div class="modal-header">
        <span class="modal-title">Settings</span>
        <button class="icon-btn" onclick="document.getElementById('settings-modal').classList.remove('open')">✕</button>
      </div>
      <div class="section-label" style="padding:0 0 6px 0;">Theme Appearance</div>
      <select class="modal-input" id="theme-select">
        <option value="theme-dark">Discord Dark (Default)</option>
        <option value="theme-light">Light Mode</option>
        <option value="theme-amoled">AMOLED Black</option>
        <option value="theme-cyberpunk">Cyberpunk</option>
        <option value="theme-nord">Nord</option>
        <option value="theme-retro">Retro Green</option>
        <option value="theme-sunset">Sunset</option>
        <option value="theme-emerald">Emerald</option>
      </select>
      <button class="btn btn-primary" id="logout-btn" style="width:100%; margin-top:10px; background:#da373c;">Log Out</button>
    </div>
  </div>

  <script>
    const DB_URL = "https://minicord-5959c-default-rtdb.asia-southeast1.firebasedatabase.app/";
    firebase.initializeApp({ databaseURL: DB_URL });
    const db = firebase.database();

    let isSignUpMode = false;
    const authSwitchBtn = document.getElementById('auth-switch-mode');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const authUserEl = document.getElementById('auth-username');
    const authPassEl = document.getElementById('auth-password');
    const authErrorEl = document.getElementById('auth-error');

    // Check existing login session on load
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('minicord_user');
      if (savedUser) {
        const uData = JSON.parse(savedUser);
        loginUser(uData.username, uData.userId, uData.color);
      }
    });

    authSwitchBtn.onclick = () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').textContent = isSignUpMode ? "Create an Account" : "Welcome to MiniCord";
      authSubmitBtn.textContent = isSignUpMode ? "Sign Up" : "Log In";
      authSwitchBtn.innerHTML = isSignUpMode ? 'Already have an account? <span style="color:var(--accent); font-weight:bold;">Log In</span>' : 'Need an account? <span style="color:var(--accent); font-weight:bold;">Sign Up</span>';
    };

    authSubmitBtn.onclick = () => {
      const uName = authUserEl.value.trim();
      const uPass = authPassEl.value.trim();
      authErrorEl.style.display = 'none';
      if (!uName || !uPass) {
        authErrorEl.textContent = "Please fill in all fields.";
        authErrorEl.style.display = 'block';
        return;
      }

      const userRef = db.ref('accounts/' + uName.toLowerCase());
      userRef.once('value', (snap) => {
        const data = snap.val();
        if (isSignUpMode) {
          if (data) {
            authErrorEl.textContent = "Username already taken!";
            authErrorEl.style.display = 'block';
          } else {
            const newColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const newId = 'u_' + Date.now();
            const newUser = { username: uName, password: uPass, userId: newId, color: newColor };
            userRef.set(newUser);
            localStorage.setItem('minicord_user', JSON.stringify(newUser));
            loginUser(uName, newId, newColor);
          }
        } else {
          if (!data || data.password !== uPass) {
            authErrorEl.textContent = "Invalid username or password!";
            authErrorEl.style.display = 'block';
          } else {
            const color = data.color || '#5865f2';
            localStorage.setItem('minicord_user', JSON.stringify({ username: data.username, userId: data.userId, color }));
            loginUser(data.username, data.userId, color);
          }
        }
      });
    };

    document.getElementById('logout-btn').onclick = () => {
      if (window.userId) db.ref('online/' + window.userId).remove();
      localStorage.removeItem('minicord_user');
      location.reload();
    };

    let username = "", userColor = "", userId = "";

    function loginUser(name, id, color) {
      username = name; userId = id; userColor = color || '#5865f2';
      window.userId = userId;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      initApp();
    }

    function initApp() {
      // Apply saved theme
      const savedTheme = localStorage.getItem('minicord_theme') || 'theme-dark';
      document.body.className = savedTheme;
      document.getElementById('theme-select').value = savedTheme;

      document.getElementById('theme-select').onchange = (e) => {
        const th = e.target.value;
        document.body.className = th;
        localStorage.setItem('minicord_theme', th);
      };

      document.getElementById('open-settings-btn').onclick = () => {
        document.getElementById('settings-modal').classList.add('open');
      };

      document.getElementById('my-name').textContent = username;
      const myAvatar = document.getElementById('my-avatar');
      myAvatar.textContent = username[0].toUpperCase();
      myAvatar.style.backgroundColor = userColor;

      // Presence tracking
      db.ref('online/' + userId).onDisconnect().remove();
      db.ref('online/' + userId).set({ name: username, color: userColor, status: 'online' });

      db.ref('online').on('value', (snap) => {
        const users = snap.val() || {};
        const onlineList = Object.values(users);
        document.getElementById('online-count').textContent = 'ONLINE — ' + onlineList.length;
        const memberListEl = document.getElementById('member-list');
        memberListEl.innerHTML = '';
        onlineList.forEach(u => {
          const div = document.createElement('div');
          div.className = 'member-item';
          div.innerHTML = `<span class="member-name" style="color:${u.color || '#fff'}">${u.name}</span><span style="width:8px;height:8px;background:#23a55a;border-radius:50%;"></span>`;
          memberListEl.appendChild(div);
        });
      });

      // Default Server / Channels setup
      db.ref('servers').once('value', (snap) => {
        if (!snap.exists()) {
          db.ref('servers').set({
            gaming: { title: 'Gaming Hub', channels: { general: true, clips: true } }
          });
        }
      });

      let activeServer = 'gaming', activeChannel = 'general';
      const channelListEl = document.getElementById('channel-list');
      const messagesEl = document.getElementById('messages');
      const chatInputEl = document.getElementById('chat-input');

      db.ref('servers/gaming/channels').on('value', (snap) => {
        const chans = snap.val() || { general: true };
        channelListEl.innerHTML = '';
        Object.keys(chans).forEach(ch => {
          const div = document.createElement('div');
          div.className = 'channel-item ' + (ch === activeChannel ? 'active' : '');
          div.innerHTML = `<span># ${ch}</span>`;
          div.onclick = () => {
            activeChannel = ch;
            document.getElementById('channel-name').textContent = ch;
            chatInputEl.placeholder = "Message #" + ch;
            loadMessages();
          };
          channelListEl.appendChild(div);
        });
        loadMessages();
      });

      function loadMessages() {
        const msgRef = db.ref('messages/' + activeServer + '/' + activeChannel);
        msgRef.on('value', (snapshot) => {
          messagesEl.innerHTML = '';
          snapshot.forEach(child => {
            const msg = child.val();
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
              <div class="avatar" style="background:${msg.color || '#5865f2'}; width:36px; height:36px; font-size:14px;">${msg.author[0]}</div>
              <div style="flex:1;">
                <div><span class="msg-author">${msg.author}</span><span class="msg-time">${msg.time}</span></div>
                <div>${msg.text}</div>
              </div>
            `;
            messagesEl.appendChild(div);
          });
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      chatInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && chatInputEl.value.trim()) {
          const val = chatInputEl.value.trim();
          db.ref('messages/' + activeServer + '/' + activeChannel).push({
            author: username,
            color: userColor,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            text: val,
            timestamp: Date.now()
          });
          chatInputEl.value = '';
        }
      });
    }
  </script>
</body>
</html>
