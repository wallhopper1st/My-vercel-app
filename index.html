<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MiniCord Ultimate</title>
  <style>
    :root {
      --bg-servers: #1e1f22;
      --bg-channels: #2b2d31;
      --bg-chat: #313338;
      --bg-chat-input: #383a40;
      --bg-hover: #35373c;
      --bg-active: #404249;
      --bg-user: #232428;
      --text-main: #dbdee1;
      --text-muted: #949ba4;
      --accent: #5865f2;
      --chat-font-size: 15px;
      --sidebar-width: 240px;
    }

    body.theme-light {
      --bg-servers: #e3e5e8; --bg-channels: #f2f3f5; --bg-chat: #ffffff;
      --bg-chat-input: #ebedef; --bg-hover: #e0e1e5; --bg-active: #d8dadf;
      --bg-user: #ebedef; --text-main: #2e3338; --text-muted: #5c6067;
    }
    body.theme-amoled {
      --bg-servers: #000000; --bg-channels: #0a0a0a; --bg-chat: #121212;
      --bg-chat-input: #1e1e1e; --bg-hover: #222222; --bg-active: #2a2a2a;
      --bg-user: #050505; --text-main: #ffffff; --text-muted: #aaaaaa;
    }
    body.theme-cyberpunk {
      --bg-servers: #0b091a; --bg-channels: #130f26; --bg-chat: #1b1338;
      --bg-chat-input: #261b4f; --bg-hover: #35256e; --bg-active: #4a3399;
      --bg-user: #0f0b21; --text-main: #00ffcc; --text-muted: #ff007f; --accent: #ff007f;
    }
    body.theme-nord {
      --bg-servers: #2e3440; --bg-channels: #3b4252; --bg-chat: #434c5e;
      --bg-chat-input: #4c566a; --bg-hover: #5e81ac; --bg-active: #81a1c1;
      --bg-user: #2e3440; --text-main: #eceff4; --text-muted: #d8dee9; --accent: #88c0d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; font-size: var(--chat-font-size); }
    body { display: flex; height: 100vh; width: 100vw; background-color: var(--bg-chat); color: var(--text-main); overflow: hidden; }

    /* Modern Thin Scrollbars */
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.3); border-radius: 4px; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.5); }

    .svg-icon { width: 20px; height: 20px; fill: currentColor; display: inline-block; vertical-align: middle; }

    /* Auth Screen */
    #auth-screen { position: fixed; inset: 0; background: #1e1f22; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .auth-card { background: #313338; width: 100%; max-width: 400px; padding: 32px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .auth-title { font-size: 24px; font-weight: bold; color: white; margin-bottom: 8px; text-align: center; }
    .auth-subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

    /* App Layout */
    #app-container { display: none; width: 100vw; height: 100vh; position: relative; }
    .servers { width: 72px; background: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 10px; flex-shrink: 0; overflow-y: auto; z-index: 20; }
    .server-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-chat); display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; color: var(--text-main); flex-shrink: 0; position: relative; }
    .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--accent); color: white; }
    .server-badge { position: absolute; top: 0; right: 0; background: #da373c; color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 2px solid var(--bg-servers); display: none; }
    .divider { width: 32px; height: 2px; background: var(--bg-hover); border-radius: 1px; flex-shrink: 0; }

    .channels { width: var(--sidebar-width); background: var(--bg-channels); display: flex; flex-direction: column; flex-shrink: 0; position: relative; min-width: 160px; max-width: 400px; z-index: 15; }
    .sidebar-resizer { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: ew-resize; z-index: 10; background: transparent; }
    .sidebar-resizer:hover { background: var(--accent); }

    .server-header { height: 48px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; border-bottom: 1px solid var(--bg-servers); color: var(--text-main); }
    .section-label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; padding: 16px 12px 4px 12px; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
    .channel-list { padding: 4px 8px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .channel-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; position: relative; transition: background 0.15s, color 0.15s; }
    .channel-item:hover { background: var(--bg-hover); color: var(--text-main); }
    .channel-item.active { background: var(--bg-active); color: var(--text-main); font-weight: 500; }
    .live-dot-badge { width: 8px; height: 8px; background: #da373c; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; margin-left: 6px; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

    .user-panel { height: 54px; background: var(--bg-user); padding: 0 8px; display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 6px; overflow: hidden; cursor: pointer; padding: 4px; border-radius: 4px; flex: 1; }
    .user-info:hover { background: var(--bg-hover); }
    .avatar-container { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; background-size: cover; background-position: center; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-user); position: absolute; bottom: -1px; right: -1px; }
